<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallel Research Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; }

  :root {
    --bg: #ffffff;
    --bg-alt: #f5f5f5;
    --text: #0d0d0d;
    --text-2: #4d4d4d;
    --text-3: #6b6b6b;
    --border: #e3e3e3;
    --accent: #8a05ff;
    --accent-hover: #48008c;
    --mono: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --bg-alt: #141414;
      --text: #ffffff;
      --text-2: #c7c7c7;
      --text-3: #b3b3b3;
      --border: #272727;
      --accent: #c29eff;
      --accent-hover: #d1b8ff;
    }
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 2rem 1rem;
    max-width: 640px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    color: var(--text-3);
    font-size: 0.875rem;
    margin-bottom: 2rem;
  }

  label {
    display: block;
    font-size: 0.8125rem;
    font-family: var(--mono);
    color: var(--text-3);
    margin-bottom: 0.5rem;
  }

  textarea {
    width: 100%;
    min-height: 100px;
    padding: 0.75rem;
    font-family: var(--sans);
    font-size: 0.9375rem;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    resize: vertical;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    margin-top: 0.75rem;
    padding: 0.625rem 1.25rem;
    font-family: var(--sans);
    font-size: 0.875rem;
    font-weight: 500;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 1.5rem;
    padding: 0.75rem;
    font-family: var(--mono);
    font-size: 0.8125rem;
    color: var(--text-3);
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: none;
  }

  .status.visible { display: block; }

  .progress {
    margin-top: 0.75rem;
    display: none;
  }

  .progress.visible { display: block; }

  .progress .phase {
    font-family: var(--mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 0.5rem;
  }

  .branches {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
  }

  .branch {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.5rem 0.625rem;
    font-size: 0.8125rem;
    line-height: 1.45;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-left: 2px solid var(--border);
    border-radius: 4px;
    color: var(--text-3);
  }

  .branch .dot {
    flex: none;
    width: 6px;
    height: 6px;
    margin-top: 0.45rem;
    border-radius: 50%;
    background: var(--text-3);
  }

  .branch.running {
    border-left-color: var(--accent);
    color: var(--text-2, var(--text-3));
  }

  .branch.running .dot {
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .branch.completed { border-left-color: #3fb950; }
  .branch.completed .dot { background: #3fb950; }
  .branch.failed { border-left-color: #f85149; }
  .branch.failed .dot { background: #f85149; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .result {
    margin-top: 1.5rem;
    display: none;
  }

  .result.visible { display: block; }

  .result h2 {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  .result pre {
    padding: 1rem;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.8125rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: auto;
    max-height: 600px;
    overflow-y: auto;
  }

  .meta {
    margin-top: 0.75rem;
    font-size: 0.8125rem;
    color: var(--text-3);
  }

  .examples {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .examples h3 {
    font-size: 0.8125rem;
    font-family: var(--mono);
    color: var(--text-3);
    font-weight: 400;
    margin-bottom: 0.75rem;
  }

  .example-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.5rem;
    font-family: var(--sans);
    font-size: 0.875rem;
    color: var(--text-2);
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }

  .example-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
</style>
</head>
<body>

<h1>Parallel Research Agent</h1>
<p class="subtitle">Web research powered by Parallel Search, Claude, and Render Workflows</p>

<label for="query">Research question</label>
<textarea id="query" placeholder="What would you like to research?"></textarea>
<button id="submit" onclick="startResearch()">Run research</button>

<div id="status" class="status"></div>

<div id="progress" class="progress"></div>

<div id="result" class="result">
  <h2>Report</h2>
  <pre id="report"></pre>
  <p class="meta" id="meta"></p>
</div>

<div class="examples">
  <h3>Try an example</h3>
  <button class="example-btn" onclick="fillExample(this)">What are the leading open-source alternatives to Elasticsearch in 2026? Compare architecture and adoption.</button>
  <button class="example-btn" onclick="fillExample(this)">How is the EU AI Act being enforced so far? What penalties have been issued?</button>
  <button class="example-btn" onclick="fillExample(this)">What are the most promising battery chemistries for grid-scale energy storage beyond lithium-ion?</button>
</div>

<script>
function fillExample(btn) {
  document.getElementById('query').value = btn.textContent;
}

const PHASE_LABELS = {
  starting: 'Starting up',
  planning: 'Planning research',
  investigating: 'Investigating in parallel',
  synthesizing: 'Synthesizing findings',
  completed: 'Complete',
  failed: 'Failed',
};

// Renders the fan-out live. Every branch is its own workflow run, so this is
// read straight off the run graph — nothing is persisted by the gateway.
async function renderProgress(runId) {
  const box = document.getElementById('progress');

  let data;
  try {
    const res = await fetch('/research/' + runId + '/progress');
    if (!res.ok) return;
    data = await res.json();
  } catch (e) {
    return;
  }

  const branches = data.branches || [];
  const done = branches.filter(b => b.status === 'completed').length;

  let phase = PHASE_LABELS[data.phase] || data.phase;
  if (data.phase === 'investigating' && branches.length) {
    phase += ' — ' + done + ' of ' + branches.length + ' complete';
  }

  const items = branches.map(b => {
    const li = document.createElement('li');
    li.className = 'branch ' + b.status;
    const dot = document.createElement('span');
    dot.className = 'dot';
    li.appendChild(dot);
    li.appendChild(document.createTextNode(b.sub_question || b.run_id));
    return li;
  });

  box.replaceChildren();

  const phaseEl = document.createElement('div');
  phaseEl.className = 'phase';
  phaseEl.textContent = phase;
  box.appendChild(phaseEl);

  if (items.length) {
    const ul = document.createElement('ul');
    ul.className = 'branches';
    items.forEach(li => ul.appendChild(li));
    box.appendChild(ul);
  }

  box.className = 'progress visible';
}

async function startResearch() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const btn = document.getElementById('submit');
  const status = document.getElementById('status');
  const resultDiv = document.getElementById('result');

  btn.disabled = true;
  status.className = 'status visible';
  resultDiv.className = 'result';
  document.getElementById('progress').className = 'progress';
  document.getElementById('progress').replaceChildren();
  status.textContent = 'Dispatching research run...';

  try {
    const res = await fetch('/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });

    if (!res.ok) {
      const err = await res.json();
      status.textContent = 'Error: ' + (err.detail || res.statusText);
      btn.disabled = false;
      return;
    }

    const data = await res.json();
    const runId = data.run_id;
    status.textContent = 'Research running... (run ' + runId.slice(0, 8) + ')';

    // Poll for completion
    const start = Date.now();
    const poll = setInterval(async () => {
      const elapsed = Math.round((Date.now() - start) / 1000);
      status.textContent = 'Researching... ' + elapsed + 's elapsed (run ' + runId.slice(0, 8) + ')';
      renderProgress(runId);

      try {
        const check = await fetch('/research/' + runId);
        const run = await check.json();

        if (run.status === 'completed' && run.result) {
          clearInterval(poll);
          status.textContent = 'Complete in ' + elapsed + 's';
          renderProgress(runId);

          document.getElementById('report').textContent = run.result.report || JSON.stringify(run.result, null, 2);

          const branches = run.result.branches_completed || '?';
          const turns = run.result.agent_turns || '?';
          const tools = run.result.tool_calls_made || '?';
          const sources = (run.result.sources || []).length;
          const failed = run.result.branches_failed || 0;

          let meta = branches + ' parallel branches, ' + turns + ' agent turns, '
            + tools + ' tool calls, ' + sources + ' sources cited';
          if (failed > 0) meta += ' (' + failed + ' branch(es) failed)';
          document.getElementById('meta').textContent = meta;

          resultDiv.className = 'result visible';
          btn.disabled = false;
        }

        if (run.status === 'failed') {
          clearInterval(poll);
          status.textContent = 'Run failed after ' + elapsed + 's';
          btn.disabled = false;
        }
      } catch (e) {
        // Transient poll error — keep trying
      }

      // Hard timeout at 5 minutes
      if (elapsed > 300) {
        clearInterval(poll);
        status.textContent = 'Timed out after 5 minutes. Check run ' + runId + ' in the Render Dashboard.';
        btn.disabled = false;
      }
    }, 3000);

  } catch (e) {
    status.textContent = 'Network error: ' + e.message;
    btn.disabled = false;
  }
}
</script>

</body>
</html>
